name: pg-mcp-homework
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: homework-demo-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${HOMEWORK_PG_PORT:-55439}:5432"
    volumes:
      - homework_pg_data:/var/lib/postgresql/data
      - ./scripts/init-demo.sql:/docker-entrypoint-initdb.d/01-homework.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homework_archive"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  homework_pg_data:
